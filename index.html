<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Ads</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f4ef;--surface:#ffffff;--ink:#1a1c19;--ink2:#2f473f;--muted:#858782;--line:#e4e7df;--green:#16c64f;--green2:#008440;--pos:#129e3f;--neg:#e5502a;--chip:#eef1ea;--hover:#f2f4ef;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--surface:#18201b;--ink:#eef3ef;--ink2:#b9d3c7;--muted:#8d9a93;--line:#27332c;--green:#16c64f;--green2:#2fd870;--pos:#3fd37b;--neg:#ff875f;--chip:#1f2a24;--hover:#1f2a24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101512;--surface:#18201b;--ink:#eef3ef;--ink2:#b9d3c7;--muted:#8d9a93;--line:#27332c;--green:#16c64f;--green2:#2fd870;--pos:#3fd37b;--neg:#ff875f;--chip:#1f2a24;--hover:#1f2a24;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.app{display:flex;min-height:100vh}
.nav{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--ink2);padding:0 8px}
.logo i{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--ink2) 0 25%,var(--green2) 0 50%,var(--green) 0 100%);display:block}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--chip);color:var(--green2);font-weight:600}
.nav .grow{flex:1}
.wrap{flex:1;min-width:0}
main{max-width:1000px;margin:0 auto;padding:28px 24px 48px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:1.5rem;font-weight:700;color:var(--ink2)}
.months{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.months button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:1.1rem;color:var(--ink)}
.months button:hover{background:var(--hover)}
.months span{min-width:130px;text-align:center;font-weight:600;text-transform:capitalize}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:500}
.card .v{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums}
.card.hl{background:var(--green2);border-color:var(--green2);color:#fff}
.card.hl h3{color:rgba(255,255,255,.8)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card h2{margin:0 0 12px;font-size:1rem;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card.hl .pos,.card.hl .neg{color:#fff}
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank small{color:var(--muted);display:block}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500}
.btn.p{background:var(--green);border-color:var(--green);color:#06210f;font-weight:600}
:is(button,a,select,input):focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.8rem;color:var(--muted);font-weight:500}
tr:last-child td{border:0}
.r{text-align:right}
.tag{padding:2px 10px;border-radius:999px;background:var(--chip);font-size:.8rem}
.tag.Ativo{color:var(--pos)}
.mini{border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:8px}
.mini:hover{background:var(--hover);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 14px;font-size:1.15rem}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
dialog .full{grid-column:1/-1}
dialog .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.foot{color:var(--muted);font-size:.82rem;margin-top:14px}
@media (max-width:820px){
  .app{flex-direction:column}
  .nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:5;gap:0}
  .nav .logo,.nav .grow{display:none}
  .nav ul{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 10px}
  main{padding:20px 14px 96px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="logo"><i></i>Meus Ads</div>
    <ul>
      <li><a href="#visao-geral" data-v="visao-geral"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="2"/><rect x="3.5" y="15" width="7" height="5.5" rx="2"/><rect x="13.5" y="3.5" width="7" height="17" rx="2"/></svg>Visão geral</a></li>
      <li><a href="#anuncios" data-v="anuncios"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5h8M8 14.5h8"/></svg>Anúncios</a></li>
      <li><a href="#plataformas" data-v="plataformas"><svg viewBox="0 0 24 24"><path d="M6 20v-5M12 20V9M18 20V4"/></svg>Plataformas</a></li>
    </ul>
  </aside>
  <div class="wrap"><main>
    <div class="head">
      <h1 id="title">Visão geral</h1>
      <div class="months"><button id="prev" aria-label="Mês anterior">‹</button><span id="mlabel"></span><button id="next" aria-label="Próximo mês">›</button></div>
    </div>
    <div id="view"></div>
    <p class="foot">Os dados ficam salvos neste navegador e neste aparelho. Baixe o CSV de vez em quando para ter uma cópia.</p>
  </main></div>
</div>

<dialog id="dlg">
  <h2 id="dtitle">Novo anúncio</h2>
  <form id="f" autocomplete="off">
    <label class="full">Nome do anúncio<input id="nome" required placeholder="Ex.: Vídeo curso 01"></label>
    <label>Plataforma<select id="plat"><option>Meta Ads</option><option>Google Ads</option><option>TikTok Ads</option><option>Kwai Ads</option><option>Outra</option></select></label>
    <label>Status<select id="status"><option>Ativo</option><option>Pausado</option><option>Encerrado</option></select></label>
    <label>Data<input id="data" type="date" required></label>
    <label>Gasto (R$)<input id="gasto" type="number" min="0" step="0.01" required></label>
    <label>Receita (R$)<input id="receita" type="number" min="0" step="0.01" required></label>
    <label>Conversões (vendas)<input id="conv" type="number" min="0" step="1" placeholder="0"></label>
    <div class="acts"><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn p">Salvar</button></div>
  </form>
</dialog>

<script>
(function(){
  var KEY="controle-ads-v1",ads=[],editing=null,view="visao-geral",fPlat="",fStatus="";
  var $=function(i){return document.getElementById(i)};
  var brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  var month=new Date().toISOString().slice(0,7);
  var TITLES={"visao-geral":"Visão geral","anuncios":"Anúncios","plataformas":"Plataformas"};

  function load(){try{var r=localStorage.getItem(KEY);ads=r?JSON.parse(r):[]}catch(e){ads=[]}if(!Array.isArray(ads))ads=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(ads))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function cls(n){return n>0?"pos":n<0?"neg":""}
  function roi(g,r){return g>0?(r-g)/g*100:null}
  function pct(v){return v===null?"—":v.toFixed(0)+"%"}
  function fmtDate(d){var p=(d||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:""}
  function shift(m,d){var p=m.split("-"),dt=new Date(+p[0],+p[1]-1+d,1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")}
  function mname(m,short){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",short?{month:"short"}:{month:"long",year:"numeric"}).replace(".","")}
  function inMonth(m){return ads.filter(function(a){return(a.data||"").slice(0,7)===m})}
  function cpa(g,c){return c>0?g/c:null}
  function money(v){return v===null?"—":brl.format(v)}
  function tot(list){var g=0,r=0,c=0;list.forEach(function(a){g+=a.gasto;r+=a.receita;c+=(a.conv||0)});return{g:g,r:r,c:c,l:r-g,roi:roi(g,r),cpa:cpa(g,c)}}

  function chart(){
    var ms=[],i;for(i=5;i>=0;i--)ms.push(shift(month,-i));
    var vals=ms.map(function(m){return tot(inMonth(m)).l});
    var max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0]));
    var H=150,top=10,span=max-min||1,zero=top+H*(max/span);
    var s='<svg class="chart" viewBox="0 0 600 200" role="img" aria-label="Lucro dos últimos 6 meses">';
    s+='<line x1="10" x2="590" y1="'+zero+'" y2="'+zero+'" stroke="var(--line)"/>';
    vals.forEach(function(v,k){
      var h=Math.abs(v)/span*H,x=30+k*95,y=v>=0?zero-h:zero;
      s+='<rect x="'+x+'" y="'+y+'" width="52" height="'+Math.max(h,v===0?0:2)+'" rx="6" fill="'+(v>=0?"var(--green)":"var(--neg)")+'"/>';
      s+='<text x="'+(x+26)+'" y="190" text-anchor="middle">'+esc(mname(ms[k],true))+'</text>';
      if(v!==0)s+='<text x="'+(x+26)+'" y="'+(v>=0?y-5:y+h+13)+'" text-anchor="middle">'+Math.round(v)+'</text>';
    });
    return s+'</svg>';
  }

  function vOverview(){
    var l=inMonth(month),t=tot(l);
    var top=l.slice().sort(function(a,b){return(b.receita-b.gasto)-(a.receita-a.gasto)}).slice(0,5);
    return '<div class="cards">'
      +'<div class="card hl"><h3>Lucro do mês</h3><div class="v">'+brl.format(t.l)+'</div></div>'
      +'<div class="card"><h3>Receita</h3><div class="v">'+brl.format(t.r)+'</div></div>'
      +'<div class="card"><h3>Investido em ads</h3><div class="v">'+brl.format(t.g)+'</div></div>'
      +'<div class="card"><h3>ROI</h3><div class="v '+(t.roi===null?"":cls(t.roi))+'">'+pct(t.roi)+'</div></div>'
      +'<div class="card"><h3>CPA (custo por conversão)</h3><div class="v">'+money(t.cpa)+'</div></div></div>'
      +'<div class="grid2"><div class="card"><h2>Lucro por mês</h2>'+chart()+'</div>'
      +'<div class="card"><h2>Melhores anúncios do mês</h2>'
      +(top.length?'<ul class="rank">'+top.map(function(a){var lu=a.receita-a.gasto;return'<li><span>'+esc(a.nome)+'<small>'+esc(a.plat)+'</small></span><b class="'+cls(lu)+'">'+brl.format(lu)+'</b></li>'}).join("")+'</ul>':'<div class="empty">Nenhum anúncio neste mês.</div>')
      +'</div></div>';
  }

  function vAds(){
    var l=inMonth(month).filter(function(a){return(!fPlat||a.plat===fPlat)&&(!fStatus||a.status===fStatus)}).sort(function(a,b){return(b.data||"").localeCompare(a.data||"")});
    var t=tot(l);
    var o='<div class="bar"><select id="fp" aria-label="Plataforma"><option value="">Todas as plataformas</option>'+["Meta Ads","Google Ads","TikTok Ads","Kwai Ads","Outra"].map(function(p){return'<option'+(p===fPlat?" selected":"")+'>'+p+'</option>'}).join("")+'</select>'
      +'<select id="fs" aria-label="Status"><option value="">Todos os status</option>'+["Ativo","Pausado","Encerrado"].map(function(p){return'<option'+(p===fStatus?" selected":"")+'>'+p+'</option>'}).join("")+'</select>'
      +'<span class="sp"></span><button class="btn" data-a="csv">Baixar CSV</button><button class="btn p" data-a="new">+ Novo anúncio</button></div>';
    o+='<div class="tw"><table><thead><tr><th>Anúncio</th><th>Plataforma</th><th>Status</th><th>Data</th><th class="r">Gasto</th><th class="r">Receita</th><th class="r">Lucro</th><th class="r">ROI</th><th class="r">Conv.</th><th class="r">CPA</th><th></th></tr></thead><tbody>';
    if(!l.length)o+='<tr><td colspan="11" class="empty" style="white-space:normal">'+(ads.length?"Nenhum anúncio neste mês com esses filtros.":"Nenhum anúncio ainda. Toque em “Novo anúncio” para começar.")+'</td></tr>';
    l.forEach(function(a){var lu=a.receita-a.gasto,ri=roi(a.gasto,a.receita);
      o+='<tr><td>'+esc(a.nome)+'</td><td>'+esc(a.plat)+'</td><td><span class="tag '+esc(a.status)+'">'+esc(a.status)+'</span></td><td>'+fmtDate(a.data)+'</td><td class="r">'+brl.format(a.gasto)+'</td><td class="r">'+brl.format(a.receita)+'</td><td class="r '+cls(lu)+'">'+brl.format(lu)+'</td><td class="r '+(ri===null?"":cls(ri))+'">'+pct(ri)+'</td><td class="r">'+(a.conv||0)+'</td><td class="r">'+money(cpa(a.gasto,a.conv||0))+'</td><td class="r"><button class="mini" data-e="'+a.id+'">Editar</button><button class="mini" data-d="'+a.id+'">Excluir</button></td></tr>'});
    if(l.length)o+='<tr><td colspan="4"><b>Total</b></td><td class="r"><b>'+brl.format(t.g)+'</b></td><td class="r"><b>'+brl.format(t.r)+'</b></td><td class="r '+cls(t.l)+'"><b>'+brl.format(t.l)+'</b></td><td class="r"><b>'+pct(t.roi)+'</b></td><td class="r"><b>'+t.c+'</b></td><td class="r"><b>'+money(t.cpa)+'</b></td><td></td></tr>';
    return o+'</tbody></table></div>';
  }

  function vPlat(){
    var l=inMonth(month),by={};
    l.forEach(function(a){(by[a.plat]=by[a.plat]||[]).push(a)});
    var keys=Object.keys(by).sort(function(a,b){return tot(by[b]).l-tot(by[a]).l});
    if(!keys.length)return'<div class="card empty">Nenhum anúncio neste mês.</div>';
    return'<div class="tw"><table><thead><tr><th>Plataforma</th><th class="r">Anúncios</th><th class="r">Gasto</th><th class="r">Receita</th><th class="r">Lucro</th><th class="r">ROI</th><th class="r">Conv.</th><th class="r">CPA</th></tr></thead><tbody>'
      +keys.map(function(k){var t=tot(by[k]);return'<tr><td>'+esc(k)+'</td><td class="r">'+by[k].length+'</td><td class="r">'+brl.format(t.g)+'</td><td class="r">'+brl.format(t.r)+'</td><td class="r '+cls(t.l)+'">'+brl.format(t.l)+'</td><td class="r '+(t.roi===null?"":cls(t.roi))+'">'+pct(t.roi)+'</td><td class="r">'+t.c+'</td><td class="r">'+money(t.cpa)+'</td></tr>'}).join("")+'</tbody></table></div>';
  }

  function render(){
    if(!TITLES[view])view="visao-geral";
    $("title").textContent=TITLES[view];$("mlabel").textContent=mname(month);
    document.querySelectorAll(".nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-v")===view)});
    $("view").innerHTML=view==="anuncios"?vAds():view==="plataformas"?vPlat():vOverview();
  }

  function openForm(a){
    editing=a?a.id:null;$("f").reset();
    $("dtitle").textContent=a?"Editar anúncio":"Novo anúncio";
    var today=new Date().toISOString().slice(0,10);
    $("data").value=a?a.data:(today.slice(0,7)===month?today:month+"-01");
    if(a){$("nome").value=a.nome;$("plat").value=a.plat;$("status").value=a.status;$("gasto").value=a.gasto;$("receita").value=a.receita;$("conv").value=a.conv||0}
    $("dlg").showModal();
  }

  $("f").addEventListener("submit",function(e){
    e.preventDefault();
    var it={id:editing||String(Date.now()),nome:$("nome").value.trim(),plat:$("plat").value,status:$("status").value,data:$("data").value,gasto:parseFloat($("gasto").value)||0,receita:parseFloat($("receita").value)||0,conv:parseInt($("conv").value,10)||0};
    if(!it.nome)return;
    if(editing)ads=ads.map(function(a){return a.id===editing?it:a});else ads.push(it);
    save();month=it.data.slice(0,7);$("dlg").close();render();
  });
  $("cancel").addEventListener("click",function(){$("dlg").close()});
  $("prev").addEventListener("click",function(){month=shift(month,-1);render()});
  $("next").addEventListener("click",function(){month=shift(month,1);render()});
  window.addEventListener("hashchange",function(){view=location.hash.slice(1)||"visao-geral";render()});

  $("view").addEventListener("change",function(e){
    if(e.target.id==="fp"){fPlat=e.target.value;render()}
    if(e.target.id==="fs"){fStatus=e.target.value;render()}
  });
  $("view").addEventListener("click",function(e){
    var t=e.target,a=t.getAttribute("data-a"),d=t.getAttribute("data-d"),ed=t.getAttribute("data-e");
    if(a==="new")openForm();
    if(a==="csv")exportCsv();
    if(d&&confirm("Excluir este anúncio?")){ads=ads.filter(function(x){return x.id!==d});save();render()}
    if(ed){var f=ads.filter(function(x){return x.id===ed})[0];if(f)openForm(f)}
  });

  function exportCsv(){
    var rows=[["Anúncio","Plataforma","Status","Data","Gasto","Receita","Lucro","Conversões","CPA"]].concat(ads.map(function(a){return[a.nome,a.plat,a.status,a.data,a.gasto,a.receita,(a.receita-a.gasto).toFixed(2),a.conv||0,(a.conv>0?(a.gasto/a.conv).toFixed(2):"")]}));
    var txt=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\n");
    try{var b=new Blob(["\ufeff"+txt],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="meus-ads.csv";document.body.appendChild(a);a.click();a.remove()}catch(err){}
  }

  load();view=location.hash.slice(1)||"visao-geral";render();
})();
</script>
</body>
</html>
